name: Rust checks
on: [push, pull_request]
defaults:
  run:
    working-directory: backend
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.95.0
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --bins
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: relay_test
          POSTGRES_PASSWORD: disposable_test_password
          POSTGRES_DB: relay_test_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay_test -d relay_test_admin"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: relay_test
      POSTGRES_PASSWORD: disposable_test_password
      POSTGRES_DB: relay_test_admin
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - run: cargo test --locked --test postgres_repository -- --ignored --test-threads=4
      - run: cargo test --locked --test delivery_ownership_schema -- --ignored
      - run: cargo test --locked --test postgres_ownership -- --ignored --test-threads=4
      - run: cargo test --locked --test postgres_retry -- --ignored --test-threads=4
      - run: cargo test --locked --test postgres_discovery -- --ignored --test-threads=1
      - run: cargo test --locked --test postgres_replay -- --ignored --test-threads=1
      - run: cargo test --locked --test postgres_consumer -- --ignored --test-threads=1
      - run: cargo test --locked --test operational_readiness -- --ignored --test-threads=1
  rabbitmq-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      rabbitmq:
        image: rabbitmq:4.3.6-management
        env:
          RABBITMQ_DEFAULT_USER: relay_test
          RABBITMQ_DEFAULT_PASS: disposable_test_password
          RABBITMQ_DEFAULT_VHOST: relay
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 5s --health-timeout 5s --health-retries 24
    env:
      RABBITMQ_HOST: 127.0.0.1
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: relay_test
      RABBITMQ_DEFAULT_PASS: disposable_test_password
      RABBITMQ_DEFAULT_VHOST: relay
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - run: cargo test --locked --test rabbitmq_publisher -- --ignored
      - run: cargo test --locked --lib infrastructure::rabbitmq::tests::closed_owned_connection_is_unavailable -- --ignored
      - run: cargo test --locked --lib infrastructure::rabbitmq::tests::publisher_admission_is_immediate_and_released_after_error_and_cancellation -- --ignored
  integrated-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: relay_test
          POSTGRES_PASSWORD: disposable_test_password
          POSTGRES_DB: relay_test_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay_test -d relay_test_admin"
          --health-interval 5s --health-timeout 5s --health-retries 12
      rabbitmq:
        image: rabbitmq:4.3.6-management
        env:
          RABBITMQ_DEFAULT_USER: relay_test
          RABBITMQ_DEFAULT_PASS: disposable_test_password
          RABBITMQ_DEFAULT_VHOST: relay
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 5s --health-timeout 5s --health-retries 24
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: relay_test
      POSTGRES_PASSWORD: disposable_test_password
      POSTGRES_DB: relay_test_admin
      RABBITMQ_HOST: 127.0.0.1
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: relay_test
      RABBITMQ_DEFAULT_PASS: disposable_test_password
      RABBITMQ_DEFAULT_VHOST: relay
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - run: cargo test --locked --test worker_smoke compiled_worker_confirms -- --ignored
      - run: cargo test --locked --test integrated_recovery -- --ignored --test-threads=1
      - name: Install isolated process-test dependency
        run: sudo apt-get update && sudo apt-get install -y supervisor
      - run: cargo test --locked --test consumer_runtime -- --ignored --test-threads=1
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test

  documentation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - run: python3 -B scripts/check-docs.py
      - run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - run: git diff --check
