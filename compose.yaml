services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    init: true
    # Three children have 30s each; allow sequential Supervisor shutdown plus margin.
    stop_grace_period: 95s
    working_dir: /app/backend
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,urllib.request; [urllib.request.urlopen('http://'+os.environ[k]+'/ready',timeout=2).read() for k in ('HTTP_METRICS_ADDR','RELAY_METRICS_ADDR','CONSUMER_METRICS_ADDR')]"]
      interval: 5s
      timeout: 8s
      retries: 12
      start_period: 15s
    environment:
      DEMO_ENABLED: "true"
      DEMO_ORIGIN: http://localhost:${HOST_FRONTEND_PORT:-5173}
      DEMO_DB_PORT: ${POSTGRES_HOST_PORT:-5433}
      DEMO_MANAGEMENT_PORT: ${RABBITMQ_MANAGEMENT_PORT:-15672}
      HTTP_METRICS_ADDR: ${HTTP_METRICS_ADDR:-127.0.0.1:9100}
      RELAY_METRICS_ADDR: ${RELAY_METRICS_ADDR:-127.0.0.1:9101}
      CONSUMER_METRICS_ADDR: ${CONSUMER_METRICS_ADDR:-127.0.0.1:9102}
      CONSUMER_NAME: ${CONSUMER_NAME:-inventory.stock.v1}
      CONSUMER_PREFETCH: ${CONSUMER_PREFETCH:-1}
      CONSUMER_SOURCE_EXCHANGE: ${CONSUMER_SOURCE_EXCHANGE:-relay.events}
      CONSUMER_SOURCE_QUEUE: ${CONSUMER_SOURCE_QUEUE:-relay.local}
      CONSUMER_SOURCE_ROUTING_KEY: ${CONSUMER_SOURCE_ROUTING_KEY:-event}
      CONSUMER_QUARANTINE_EXCHANGE: ${CONSUMER_QUARANTINE_EXCHANGE:-relay.quarantine}
      CONSUMER_QUARANTINE_QUEUE: ${CONSUMER_QUARANTINE_QUEUE:-relay.quarantine.inventory}
      CONSUMER_QUARANTINE_ROUTING_KEY: ${CONSUMER_QUARANTINE_ROUTING_KEY:-inventory}
      CONSUMER_OPERATION_MS: ${CONSUMER_OPERATION_MS:-10000}
      CONSUMER_RECONNECT_MS: ${CONSUMER_RECONNECT_MS:-5000}
      CONSUMER_DRAIN_MS: ${CONSUMER_DRAIN_MS:-15000}
      CONSUMER_SHUTDOWN_MS: ${CONSUMER_SHUTDOWN_MS:-25000}
      CONSUMER_POOL_MAX: ${CONSUMER_POOL_MAX:-2}
      CONSUMER_POOL_ACQUIRE_MS: ${CONSUMER_POOL_ACQUIRE_MS:-5000}
      CONSUMER_STATEMENT_MS: ${CONSUMER_STATEMENT_MS:-5000}
      CONSUMER_LOCK_MS: ${CONSUMER_LOCK_MS:-3000}
      REPLAY_OPERATORS: ${REPLAY_OPERATORS:-}
      RELAY_MAINTENANCE_CANDIDATES: ${RELAY_MAINTENANCE_CANDIDATES:-}
      RELAY_LEASE_MS: ${RELAY_LEASE_MS:-60000}
      RELAY_IDLE_MS: ${RELAY_IDLE_MS:-1000}
      RELAY_FAILURE_MS: ${RELAY_FAILURE_MS:-1000}
      RELAY_RECONNECT_MS: ${RELAY_RECONNECT_MS:-5000}
      RELAY_POOL_MAX: ${RELAY_POOL_MAX:-2}
      RELAY_POOL_ACQUIRE_MS: ${RELAY_POOL_ACQUIRE_MS:-5000}
      RELAY_STATEMENT_MS: ${RELAY_STATEMENT_MS:-5000}
      RELAY_LOCK_MS: ${RELAY_LOCK_MS:-3000}
      RELAY_DRAIN_MS: ${RELAY_DRAIN_MS:-15000}
      RELAY_SHUTDOWN_MS: ${RELAY_SHUTDOWN_MS:-25000}
      RABBITMQ_CONNECT_TIMEOUT_MS: ${RABBITMQ_CONNECT_TIMEOUT_MS:-10000}
      RABBITMQ_PUBLISH_TIMEOUT_MS: ${RABBITMQ_PUBLISH_TIMEOUT_MS:-10000}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-relay.events}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-relay.local}
      RABBITMQ_ROUTING_KEY: ${RABBITMQ_ROUTING_KEY:-event}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-relay}
      CARGO_HOME: /app/.cargo-cache
      CARGO_TARGET_DIR: /app/target
      POSTGRES_USER: ${POSTGRES_USER:-change_me}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-reliable_event_relay}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:${HOST_HTTP_PORT:-8080}:8080"
  frontend:
    image: node:22-bookworm-slim
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    init: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /app/frontend
    environment:
      npm_config_cache: /tmp/npm-cache
      DEMO_API_TARGET: http://app:8080
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"]
    volumes:
      - ./frontend:/app/frontend
    ports:
      - "127.0.0.1:${HOST_FRONTEND_PORT:-5173}:5173"
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-reliable_event_relay}
      POSTGRES_USER: ${POSTGRES_USER:-change_me}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - ./.dockerized-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'PGPASSWORD="$$POSTGRES_PASSWORD" PGCONNECT_TIMEOUT=3 psql -X -w -h "$$POSTGRES_HOST" -p "$$POSTGRES_PORT" -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -v ON_ERROR_STOP=1 -Atqc "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  rabbitmq:
    image: rabbitmq:4.3.6-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-relay}
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./docker/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "gosu", "rabbitmq", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
volumes:
  rabbitmq-data:
